<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>芳华照云阙百业报名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1626;
    --bg-glow: radial-gradient(circle at 50% -8%, rgba(201,162,78,0.14), transparent 55%);
    --card:#1A2740;
    --card-border: rgba(201,162,78,0.32);
    --gold:#C9A24E;
    --gold-soft: rgba(201,162,78,0.55);
    --jade:#3E9179;
    --jade-bg: rgba(62,145,121,0.14);
    --jade-border: rgba(62,145,121,0.45);
    --copper:#C98240;
    --copper-bg: rgba(201,130,64,0.14);
    --copper-border: rgba(201,130,64,0.45);
    --text:#F1ECDD;
    --text-dim:#8C97AC;
    --danger:#C96A63;
    --input-bg:#111B2E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg-glow), var(--bg);
    color:var(--text);
    font-family:'Noto Sans SC', sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom:48px;
  }
  ::selection{ background: var(--gold-soft); color:#10182B; }
  header{
    position: sticky; top:0; z-index:5;
    background: linear-gradient(180deg, #101A2F 0%, #101A2F 78%, rgba(16,26,47,0));
    padding:22px 18px 16px;
  }
  .title-row{ display:flex; align-items:center; gap:10px; }
  .cloud-mark{ flex:0 0 auto; width:26px; height:26px; }
  h1{
    font-family:'Noto Serif SC', serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.5px;
    color:var(--gold);
    margin:0;
    line-height:1.3;
  }
  .tz-note{
    margin:8px 0 0;
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.6;
  }
  .tz-note b{ color:var(--gold); font-weight:500; }
  .gold-rule{
    margin-top:16px;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--gold-soft) 20%, var(--gold-soft) 80%, transparent);
  }
  main{ padding:16px 14px 0; max-width:520px; margin:0 auto; }
  .empty-state{
    text-align:center;
    color:var(--text-dim);
    padding:56px 20px;
    font-size:14px;
    line-height:1.9;
  }
  .empty-state .empty-title{ color:var(--text); font-size:16px; margin-bottom:6px; font-family:'Noto Serif SC', serif; }
  .activity-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:16px 14px 12px;
    margin-bottom:16px;
  }
  .activity-name{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--card-border);
    color:var(--text);
    font-family:'Noto Serif SC', serif;
    font-size:17px;
    font-weight:700;
    padding:2px 2px 8px;
    outline:none;
  }
  .activity-name::placeholder{ color:var(--text-dim); font-weight:400; font-family:'Noto Sans SC', sans-serif; font-size:14.5px; }
  .activity-name:focus{ border-bottom-color: var(--gold); }
  .activity-time-row{
    display:flex; align-items:center; gap:8px;
    margin-top:12px; flex-wrap:wrap;
  }
  .time-label{ font-size:12.5px; color:var(--text-dim); flex:0 0 auto; }
  .time-date, .time-time{
    background:var(--input-bg);
    border:1px solid var(--card-border);
    color:var(--text);
    border-radius:6px;
    padding:6px 8px;
    font-size:13px;
    font-family:'Noto Sans SC', sans-serif;
    outline:none;
  }
  .time-date:focus, .time-time:focus{ border-color:var(--gold); }
  .time-hint{
    margin-top:8px;
    font-size:12px;
    color:var(--text-dim);
    line-height:1.6;
  }
  .time-hint.set{ color:var(--gold); }
  .slot-group{ margin-top:16px; }
  .group-label{
    font-size:12.5px;
    font-weight:500;
    margin-bottom:6px;
    padding-left:10px;
    position:relative;
  }
  .group-label::before{
    content:'';
    position:absolute; left:0; top:2px; bottom:2px; width:3px; border-radius:2px;
  }
  .main-label{ color:var(--jade); }
  .main-label::before{ background:var(--jade); }
  .backup-label{ color:var(--copper); }
  .backup-label::before{ background:var(--copper); }
  .slot-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px;
    border-radius:8px;
    margin-bottom:6px;
    border:1px solid transparent;
    min-height:44px;
  }
  .slot-main{ background:var(--jade-bg); }
  .slot-main.filled{ border-color:var(--jade-border); }
  .slot-backup{ background:var(--copper-bg); }
  .slot-backup.filled{ border-color:var(--copper-border); }
  .slot-label{
    flex:0 0 52px;
    font-size:12px;
    color:var(--text-dim);
  }
  .slot-info{ flex:1 1 auto; min-width:0; }
  .slot-gameid{ font-size:14.5px; font-weight:500; color:var(--text); word-break:break-all; }
  .slot-meta{ display:flex; gap:6px; flex-wrap:wrap; margin-top:3px; }
  .role-pill{
    font-size:11.5px;
    background:rgba(241,236,221,0.1);
    color:var(--text);
    padding:1px 8px;
    border-radius:20px;
  }
  .slot-note{ font-size:12px; color:var(--text-dim); }
  .add-btn{
    margin-left:auto;
    background:transparent;
    border:1px solid var(--gold-soft);
    color:var(--gold);
    border-radius:20px;
    padding:6px 14px;
    font-size:13px;
    font-family:'Noto Sans SC', sans-serif;
  }
  .remove-btn{
    flex:0 0 auto;
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-size:18px;
    line-height:1;
    padding:4px 6px;
  }
  .add-activity-wrap{ text-align:center; margin:6px 0 24px; }
  .btn-add-activity{
    background:transparent;
    border:1px dashed var(--gold-soft);
    color:var(--gold);
    border-radius:10px;
    padding:14px;
    width:100%;
    font-size:14.5px;
    font-family:'Noto Sans SC', sans-serif;
  }
  .limit-note{ text-align:center; color:var(--text-dim); font-size:12px; margin:4px 0 24px; }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(9,13,22,0.68);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:20;
  }
  .modal-overlay.hidden{ display:none; }
  .modal{
    background:#182238;
    border:1px solid var(--card-border);
    border-radius:16px 16px 0 0;
    padding:20px 18px 26px;
    width:100%; max-width:520px;
  }
  .modal-title{
    font-family:'Noto Serif SC', serif;
    color:var(--gold);
    font-size:17px;
    margin:0 0 14px;
  }
  .field-label{ display:block; font-size:12.5px; color:var(--text-dim); margin:12px 0 6px; }
  .field-label .required{ color:var(--danger); }
  .modal input[type=text], .modal select{
    width:100%;
    background:var(--input-bg);
    border:1px solid var(--card-border);
    color:var(--text);
    border-radius:8px;
    padding:10px 11px;
    font-size:14.5px;
    font-family:'Noto Sans SC', sans-serif;
    outline:none;
  }
  .modal input:focus, .modal select:focus{ border-color:var(--gold); }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .btn-primary, .btn-secondary{
    flex:1; padding:12px; border-radius:8px; font-size:14.5px; border:none;
    font-family:'Noto Sans SC', sans-serif;
  }
  .btn-primary{ background:var(--gold); color:#1A1204; font-weight:700; }
  .btn-secondary{ background:transparent; border:1px solid var(--card-border); color:var(--text-dim); }
  .form-error{ color:var(--danger); font-size:12.5px; margin-top:6px; display:none; }
  .form-error.show{ display:block; }
  button{ cursor:pointer; }
  input, select{ -webkit-appearance:none; }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <svg class="cloud-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 30c-4 0-7-3-7-7s3-7 7-7c1-5 5-9 11-9 5 0 9 3 10 8 5 0 9 4 9 8s-4 7-9 7H10z" stroke="#C9A24E" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <h1>芳华照云阙百业报名</h1>
  </div>
  <p class="tz-note">全部活动时间均以 <b>美东时间（ET）</b> 为准，报名前请留意时区换算。</p>
  <div class="gold-rule"></div>
</header>
<main id="app"></main>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h3 class="modal-title" id="modalTitle">报名</h3>
    <label class="field-label">游戏ID <span class="required">*</span></label>
    <input type="text" id="modalGameId" placeholder="请输入游戏ID" />
    <label class="field-label">游戏流派（可选）</label>
    <select id="modalRole">
      <option value="">请选择</option>
      <option value="坦克">坦克</option>
      <option value="奶妈">奶妈</option>
      <option value="输出">输出</option>
      <option value="辅助">辅助</option>
    </select>
    <label class="field-label">备注（可选，最多20字，如有特殊情况请说明，例如可能迟到、需请假等）</label>
    <input type="text" id="modalNote" maxlength="20" placeholder="最多20字" />
    <div class="form-error" id="modalError">请填写游戏ID</div>
    <div class="modal-actions">
      <button class="btn-secondary" id="modalCancel">取消</button>
      <button class="btn-primary" id="modalSubmit">确认报名</button>
    </div>
  </div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'baiye_activities_v1';
  var MAIN_COUNT = 10, BACKUP_COUNT = 5, TOTAL_SLOTS = MAIN_COUNT + BACKUP_COUNT;
  var MAX_ACTIVITIES = 5;
  var EXPIRE_MS = 24 * 3600 * 1000;

  var state = { activities: [] };
  var modalCtx = null;
  var storageMode = (typeof window.storage !== 'undefined' && window.storage) ? 'cloud' : 'local';

  function uid(){ return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- Eastern time helpers ----------
  function getEasternOffsetMinutesAt(utcDate){
    try{
      var dtf = new Intl.DateTimeFormat('en-US', { timeZone:'America/New_York', timeZoneName:'shortOffset' });
      var parts = dtf.formatToParts(utcDate);
      var tzPart = parts.find(function(p){ return p.type === 'timeZoneName'; });
      var m = tzPart && tzPart.value.match(/GMT([+-]\d+)/);
      return m ? parseInt(m[1],10) * 60 : -300;
    }catch(e){ return -300; }
  }
  function easternWallClockToUTCms(y,mo,d,hh,mm){
    var roughUTCms = Date.UTC(y, mo-1, d, hh, mm);
    var offsetMin = getEasternOffsetMinutesAt(new Date(roughUTCms));
    return roughUTCms - offsetMin*60000;
  }
  function getEasternNowParts(){
    var dtf = new Intl.DateTimeFormat('en-US', { timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit', weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false });
    var parts = dtf.formatToParts(new Date());
    var obj = {};
    parts.forEach(function(p){ obj[p.type] = p.value; });
    return obj;
  }
  function getEasternDateTimeParts(utcMs){
    var dtf = new Intl.DateTimeFormat('en-CA', { timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false });
    var parts = dtf.formatToParts(new Date(utcMs));
    var obj = {};
    parts.forEach(function(p){ obj[p.type] = p.value; });
    return obj;
  }
  function getUpcomingSaturdayEastern(){
    var parts = getEasternNowParts();
    var y = parseInt(parts.year,10), mo = parseInt(parts.month,10), d = parseInt(parts.day,10);
    var weekdayMap = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
    var wd = weekdayMap[parts.weekday];
    var daysToAdd;
    if (wd === 6) daysToAdd = 0;
    else if (wd === 0) daysToAdd = 6;
    else daysToAdd = 6 - wd;
    var baseNoonUTC = Date.UTC(y, mo-1, d, 12, 0, 0);
    var targetDate = new Date(baseNoonUTC + daysToAdd*86400000);
    return { y: targetDate.getUTCFullYear(), m: targetDate.getUTCMonth()+1, d: targetDate.getUTCDate() };
  }
  function computeDefaultActivityTimeUTCms(){
    var sat = getUpcomingSaturdayEastern();
    return easternWallClockToUTCms(sat.y, sat.m, sat.d, 17, 0);
  }
  function formatEasternDisplay(utcMs){
    if(!utcMs) return '';
    var dtf = new Intl.DateTimeFormat('zh-CN', { timeZone:'America/New_York', year:'numeric', month:'long', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false });
    return dtf.format(new Date(utcMs)) + '（美东时间）';
  }

  // ---------- storage ----------
  function loadState(){
    return new Promise(function(resolve){
      if(storageMode === 'cloud'){
        window.storage.get(STORAGE_KEY, true).then(function(res){
          if(res && res.value){
            try{ resolve(JSON.parse(res.value)); return; }catch(e){}
          }
          resolve({ activities: [] });
        }).catch(function(){ resolve({ activities: [] }); });
      } else {
        try{
          var raw = localStorage.getItem(STORAGE_KEY);
          resolve(raw ? JSON.parse(raw) : { activities: [] });
        }catch(e){ resolve({ activities: [] }); }
      }
    });
  }
  function saveState(s){
    var json = JSON.stringify(s);
    if(storageMode === 'cloud'){
      return window.storage.set(STORAGE_KEY, json, true).catch(function(e){ console.error('save failed', e); });
    } else {
      try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){}
      return Promise.resolve();
    }
  }

  function blankActivity(){
    return { id: uid(), name:'', timeYMD:'', timeHM:'', timeTouched:false, timeUTCms:null, slots: new Array(TOTAL_SLOTS).fill(null) };
  }

  function cleanupExpired(s){
    var changed = false;
    s.activities.forEach(function(act){
      if(act.timeUTCms && (Date.now() - act.timeUTCms > EXPIRE_MS)){
        act.name=''; act.timeYMD=''; act.timeHM=''; act.timeTouched=false; act.timeUTCms=null;
        act.slots = new Array(TOTAL_SLOTS).fill(null);
        changed = true;
      }
    });
    return changed;
  }

  // ---------- render ----------
  function renderSlotRow(activity, idx){
    var slot = activity.slots[idx];
    var isBackup = idx >= MAIN_COUNT;
    var label = isBackup ? ('备选 ' + (idx - MAIN_COUNT + 1)) : ('正选 ' + (idx + 1));
    var groupClass = isBackup ? 'slot-backup' : 'slot-main';
    if(slot){
      var metaBits = '';
      if(slot.role) metaBits += '<span class="role-pill">' + escapeHtml(slot.role) + '</span>';
      if(slot.note) metaBits += '<span class="slot-note">' + escapeHtml(slot.note) + '</span>';
      return '<div class="slot-row ' + groupClass + ' filled">' +
        '<div class="slot-label">' + label + '</div>' +
        '<div class="slot-info"><div class="slot-gameid">' + escapeHtml(slot.gameId) + '</div>' +
        (metaBits ? '<div class="slot-meta">' + metaBits + '</div>' : '') +
        '</div>' +
        '<button class="remove-btn" data-action="remove" data-act="' + activity.id + '" data-idx="' + idx + '" aria-label="取消报名">×</button>' +
        '</div>';
    } else {
      return '<div class="slot-row ' + groupClass + ' empty">' +
        '<div class="slot-label">' + label + '</div>' +
        '<button class="add-btn" data-action="signup" data-act="' + activity.id + '" data-idx="' + idx + '">＋ 报名</button>' +
        '</div>';
    }
  }

  function renderActivity(activity){
    var hasTime = !!activity.timeUTCms;
    var hint = hasTime
      ? '当前设定：' + formatEasternDisplay(activity.timeUTCms)
      : '未设置 · 首位报名者直接报名时，将自动设为本周六 17:00（美东时间）';
    var main = [];
    for(var i=0;i<MAIN_COUNT;i++) main.push(renderSlotRow(activity, i));
    var backup = [];
    for(var j=MAIN_COUNT;j<TOTAL_SLOTS;j++) backup.push(renderSlotRow(activity, j));

    return '<section class="activity-card" data-act="' + activity.id + '">' +
      '<input class="activity-name" type="text" maxlength="20" placeholder="点击输入活动名称（最多20字）" value="' + escapeHtml(activity.name) + '" data-action="editname" data-act="' + activity.id + '" />' +
      '<div class="activity-time-row">' +
        '<span class="time-label">活动时间</span>' +
        '<input type="date" class="time-date" data-action="editdate" data-act="' + activity.id + '" value="' + escapeHtml(activity.timeYMD) + '" />' +
        '<input type="time" class="time-time" data-action="edittime" data-act="' + activity.id + '" value="' + escapeHtml(activity.timeHM) + '" />' +
      '</div>' +
      '<div class="time-hint' + (hasTime ? ' set' : '') + '">' + hint + '</div>' +
      '<div class="slot-group">' +
        '<div class="group-label main-label">正选（10）</div>' + main.join('') +
      '</div>' +
      '<div class="slot-group">' +
        '<div class="group-label backup-label">备选（5）</div>' + backup.join('') +
      '</div>' +
    '</section>';
  }

  function render(){
    var app = document.getElementById('app');
    var html = '';
    if(state.activities.length === 0){
      html += '<div class="empty-state"><div class="empty-title">还没有活动</div>点击下方按钮创建第一个活动吧</div>';
    } else {
      state.activities.forEach(function(act){ html += renderActivity(act); });
    }
    if(state.activities.length < MAX_ACTIVITIES){
      html += '<div class="add-activity-wrap"><button class="btn-add-activity" id="btnAddActivity">＋ 添加活动（' + state.activities.length + '/' + MAX_ACTIVITIES + '）</button></div>';
    } else {
      html += '<p class="limit-note">已达到最多 5 个活动</p>';
    }
    app.innerHTML = html;
  }

  // ---------- actions ----------
  function addActivity(){
    if(state.activities.length >= MAX_ACTIVITIES) return;
    state.activities.push(blankActivity());
    saveState(state).then(render);
  }

  function editName(actId, value){
    var act = state.activities.find(function(a){ return a.id === actId; });
    if(!act) return;
    act.name = value.slice(0,20);
    saveState(state);
  }

  function recomputeTime(act){
    if(act.timeYMD && act.timeHM){
      var dp = act.timeYMD.split('-').map(Number);
      var tp = act.timeHM.split(':').map(Number);
      act.timeUTCms = easternWallClockToUTCms(dp[0], dp[1], dp[2], tp[0], tp[1]);
    } else {
      act.timeUTCms = null;
    }
  }

  function editDate(actId, value){
    var act = state.activities.find(function(a){ return a.id === actId; });
    if(!act) return;
    act.timeYMD = value;
    act.timeTouched = true;
    recomputeTime(act);
    saveState(state).then(render);
  }

  function editTime(actId, value){
    var act = state.activities.find(function(a){ return a.id === actId; });
    if(!act) return;
    act.timeHM = value;
    act.timeTouched = true;
    recomputeTime(act);
    saveState(state).then(render);
  }

  function openModal(actId, idx){
    modalCtx = { actId: actId, idx: idx };
    document.getElementById('modalGameId').value = '';
    document.getElementById('modalRole').value = '';
    document.getElementById('modalNote').value = '';
    document.getElementById('modalError').classList.remove('show');
    var isBackup = idx >= MAIN_COUNT;
    document.getElementById('modalTitle').textContent = isBackup ? '备选报名' : '正选报名';
    document.getElementById('modalOverlay').classList.remove('hidden');
    setTimeout(function(){ document.getElementById('modalGameId').focus(); }, 50);
  }
  function closeModal(){
    document.getElementById('modalOverlay').classList.add('hidden');
    modalCtx = null;
  }

  function submitSignup(){
    if(!modalCtx) return;
    var gameId = document.getElementById('modalGameId').value.trim();
    if(!gameId){
      document.getElementById('modalError').classList.add('show');
      return;
    }
    var role = document.getElementById('modalRole').value;
    var note = document.getElementById('modalNote').value.trim().slice(0,20);

    var act = state.activities.find(function(a){ return a.id === modalCtx.actId; });
    if(!act){ closeModal(); return; }
    if(act.slots[modalCtx.idx]){ closeModal(); return; }

    var wasEmpty = act.slots.every(function(s){ return !s; });
    if(wasEmpty && !act.timeTouched && !act.timeUTCms){
      act.timeUTCms = computeDefaultActivityTimeUTCms();
      var p = getEasternDateTimeParts(act.timeUTCms);
      act.timeYMD = p.year + '-' + p.month + '-' + p.day;
      act.timeHM = p.hour + ':' + p.minute;
    }
    act.slots[modalCtx.idx] = { gameId: gameId, role: role, note: note };
    saveState(state).then(function(){ closeModal(); render(); });
  }

  function removeSignup(actId, idx){
    var act = state.activities.find(function(a){ return a.id === actId; });
    if(!act) return;
    act.slots[idx] = null;
    saveState(state).then(render);
  }

  // ---------- events ----------
  document.getElementById('app').addEventListener('click', function(e){
    var addBtn = e.target.closest('#btnAddActivity');
    if(addBtn){ addActivity(); return; }
    var signupBtn = e.target.closest('[data-action="signup"]');
    if(signupBtn){ openModal(signupBtn.dataset.act, parseInt(signupBtn.dataset.idx,10)); return; }
    var removeBtn = e.target.closest('[data-action="remove"]');
    if(removeBtn){ removeSignup(removeBtn.dataset.act, parseInt(removeBtn.dataset.idx,10)); return; }
  });
  document.getElementById('app').addEventListener('change', function(e){
    var t = e.target;
    if(t.dataset.action === 'editname') editName(t.dataset.act, t.value);
    else if(t.dataset.action === 'editdate') editDate(t.dataset.act, t.value);
    else if(t.dataset.action === 'edittime') editTime(t.dataset.act, t.value);
  });
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSubmit').addEventListener('click', submitSignup);
  document.getElementById('modalOverlay').addEventListener('click', function(e){
    if(e.target.id === 'modalOverlay') closeModal();
  });

  // ---------- init ----------
  function init(){
    loadState().then(function(s){
      state = s;
      var changed = cleanupExpired(state);
      render();
      if(changed) saveState(state);
    });
  }
  init();
  setInterval(function(){
    loadState().then(function(s){
      state = s;
      var changed = cleanupExpired(state);
      render();
      if(changed) saveState(state);
    });
  }, 20000);
})();
</script>
</body>
</html>
